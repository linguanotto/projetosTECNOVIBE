<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Álbum de Figurinha</title>

  <!-- A-Frame e AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jeromeetienne/ar.js@1.7.2/aframe/build/aframe-ar.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #toggleSound {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 10px;
      font-size: 16px;
      display: none;
    }

    /* Oculta mensagens estranhas do AR.js na tela */
    body > div:not([id]):not([class]) {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Botão para ativar/desativar som -->
  <button id="toggleSound">Ativar Som 🔊</button>

  <a-scene vr-mode-ui="enabled: false;" embedded arjs="debugUIEnabled: false;">
    <a-assets>
      <video id="videoAR" src="https://linguanotto.github.io/projetosTECNOVIBE/assets/videoLarissa.mp4"
             preload="auto" loop playsinline></video>
    </a-assets>

    <!-- Marcador personalizado -->
    <a-marker id="customMarker" type="pattern"
              url="https://linguanotto.github.io/projetosTECNOVIBE/assets/album.patt">
      <a-video id="videoElement"
               autoplay
               rotation="-35 0 0"
               position="0 1 0"
               width="0.6" height="1.0"
               src="#videoAR">
      </a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    window.onload = function () {
      const video = document.getElementById("videoAR");
      const button = document.getElementById("toggleSound");
      const marker = document.getElementById("customMarker");

      video.muted = true; // Começa mutado

      // Quando o marcador aparece
      marker.addEventListener("markerFound", () => {
        video.play();
        button.style.display = "block";
      });

      // Quando o marcador desaparece
      marker.addEventListener("markerLost", () => {
        video.pause();
        button.style.display = "none";
      });

      // Alternar som
      button.addEventListener("click", () => {
        video.muted = !video.muted;
        button.textContent = video.muted ? "Ativar Som 🔊" : "Desativar Som 🔇";
      });
    };
  </script>

</body>
</html>
